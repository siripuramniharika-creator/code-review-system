<div class="utils-main flex font-[sans-serif] min-h-screen ">
    <div class="utils-header w-full shadow-md bg-white px-6 py-4">
        <mat-card class="flex justify-between items-center shadow-none bg-transparent p-3">
            <div class="flex items-center gap-3">

                <div class="bg-linear-to-r from-blue-950 to-blue-700 p-3 rounded-xl flex items-center justify-center">
                    <mat-icon class="login-icon text-white">code</mat-icon>
                </div>

                <span class="text-2xl font-semibold  bg-linear-to-r from-blue-950 to-blue-700 bg-clip-text text-transparent">
                    AI Code Review
                </span>

            </div>
            <div class="flex items-center gap-8 text-gray-600">

                <button class="flex items-center gap-1  text-black hover:font-bold hover:bg-linear-to-r hover:from-blue-950 hover:to-blue-700 hover:bg-clip-text hover:text-transparent transition-all duration-300 cursor-pointer">
                    <mat-icon>home</mat-icon>
                    Dashboard
                </button>

                <button class="flex items-center gap-1 text-black hover:font-bold hover:bg-linear-to-r hover:from-blue-950 hover:to-blue-700 hover:bg-clip-text hover:text-transparent transition-all duration-300 cursor-pointer">
                    <mat-icon>history</mat-icon>
                    History
                </button>

                <button class="flex items-center gap-1  text-black hover:font-bold hover:bg-linear-to-r hover:from-blue-950 hover:to-blue-700 hover:bg-clip-text hover:text-transparent transition-all duration-300 cursor-pointer">
                    <mat-icon>person</mat-icon>
                    Profile
                </button>

                <button matButton="outlined" class="hover:bg-linear-to-r from-blue-950 to-blue-700 hover:text-white text-black px-4 py-2 rounded-lg flex items-center gap-2" >
                    <mat-icon>logout</mat-icon>
                    Logout
                </button>
            </div>
        </mat-card>
    </div>
    <div class="p-6">

        <app-dashboard *ngIf="selectedPage==='dashboard'"></app-dashboard>

        <app-history *ngIf="selectedPage==='history'"></app-history>

        <app-profile *ngIf="selectedPage==='profile'"></app-profile>

    </div>
</div>
